name: Initialize DuckDuckGo Vietnamese source
on:
  push:
    paths:
      - '.bootstrap/bundle.tar.xz.base64'
      - '.github/workflows/bootstrap.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  initialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify and unpack source archive
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .bootstrap/bundle.tar.xz.base64 > "$RUNNER_TEMP/localization.tar.xz"
          echo '90fc76356eaea3287a11e0fc5cf03deddbcfb508519ee86035ba8a47a9aa2a44  '"$RUNNER_TEMP/localization.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/localization.tar.xz" -C .
          rm -f .bootstrap/bundle.tar.xz.base64
          rmdir .bootstrap || true
          rm -f .github/workflows/bootstrap.yml
      - name: Run offline unit tests before commit
        run: python3 -m unittest discover -s tests -v
      - name: Commit expanded sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "Already bootstrapped"
            exit 0
          fi
          git commit -m 'feat: initialize Vietnamese iOS localization and CI'
          git push
